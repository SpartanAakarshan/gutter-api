<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upgrade — Gutter</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      color: rgba(255,255,255,0.6);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: #ffffff; }
    a:hover { opacity: 0.6; }
    nav { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 18px 0; }
    nav .container { display: flex; align-items: center; }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
      color: #ffffff; text-decoration: none;
    }
    .logo img { width: 22px; height: 22px; }
    .container { max-width: 620px; margin: 0 auto; padding: 0 24px; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 36px;
    }
    .tag {
      display: block;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .price {
      font-size: 32px;
      color: #ffffff;
      margin-bottom: 4px;
      font-weight: normal;
    }
    .price span {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
    }
    .features {
      margin: 24px 0;
      list-style: none;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      line-height: 2.2;
    }
    .features li::before { content: '— '; color: rgba(255,255,255,0.2); }
    label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      margin-bottom: 8px;
      margin-top: 24px;
    }
    input {
      width: 100%;
      background: #000000;
      border: 1px solid rgba(255,255,255,0.15);
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      padding: 10px 12px;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.2); }
    input:focus { border-color: rgba(255,255,255,0.5); }
    button {
      width: 100%;
      margin-top: 20px;
      background: #ffffff;
      border: none;
      color: #000000;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 13px;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.85); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    #status {
      margin-top: 14px;
      font-size: 11px;
      min-height: 16px;
      color: rgba(255,255,255,0.5);
    }
    .ok  { color: rgba(255,255,255,0.8) !important; }
    .err { color: rgba(255,80,80,0.9)   !important; }
    footer { padding: 28px 0; border-top: 1px solid rgba(255,255,255,0.06); font-size: 10px; color: rgba(255,255,255,0.2); }
    footer .container { display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <nav>
    <div class="container">
      <a class="logo" href="/"><img src="/favicon.svg" alt="">Gutter</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <span class="tag">Gutter // Upgrade</span>
      <div class="price">₹200 <span>/ month</span></div>
      <ul class="features">
        <li>Unlimited searches</li>
        <li>Your own AI provider key</li>
        <li>All websites supported</li>
        <li>Cancel anytime</li>
      </ul>

      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />

      <button id="pay-btn">Subscribe — ₹200/mo</button>
      <div id="status"></div>
    </div>
  </main>

  <footer>
    <div class="container">
      <span>© 2026 Gutter.</span>
      <a href="/privacy" style="color:rgba(255,255,255,0.2);text-decoration:none;">Privacy</a>
    </div>
  </footer>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const btn    = document.getElementById('pay-btn');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      if (!email || !email.includes('@')) {
        status.textContent = 'Enter a valid email.';
        status.className = 'err';
        return;
      }

      btn.disabled = true;
      status.textContent = 'Creating subscription…';
      status.className = '';

      try {
        const res  = await fetch('/api/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.error) {
          status.textContent = data.error;
          status.className = 'err';
          btn.disabled = false;
          return;
        }

        const rzp = new Razorpay({
          key: data.key_id,
          subscription_id: data.subscription_id,
          name: 'Gutter',
          description: 'Unlimited searches — ₹200/month',
          prefill: { email },
          theme: { color: '#ffffff' },
          handler: function() {
            status.textContent = 'Payment successful. Account upgraded within seconds.';
            status.className = 'ok';
            btn.disabled = true;
          },
          modal: {
            ondismiss: function() {
              btn.disabled = false;
              status.textContent = '';
            }
          }
        });

        rzp.open();
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
        status.className = 'err';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
