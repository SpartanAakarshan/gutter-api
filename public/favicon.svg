<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="31" fill="#1a1a1a" stroke="#555" stroke-width="2"/>
  <!-- Ring groove -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#444" stroke-width="2.5"/>
  <!-- Inner disc -->
  <circle cx="32" cy="32" r="24" fill="#222"/>

  <!-- Radial ribs -->
  <g stroke="#3a3a3a" stroke-width="1.2" stroke-linecap="round">
    <line x1="32" y1="8" x2="32" y2="56"/>
    <line x1="8" y1="32" x2="56" y2="32"/>
    <line x1="15" y1="15" x2="49" y2="49"/>
    <line x1="49" y1="15" x2="15" y2="49"/>
    <!-- Secondary ribs -->
    <line x1="20" y1="9.5" x2="44" y2="54.5"/>
    <line x1="44" y1="9.5" x2="20" y2="54.5"/>
    <line x1="9.5" y1="20" x2="54.5" y2="44"/>
    <line x1="9.5" y1="44" x2="54.5" y2="20"/>
  </g>

  <!-- Concentric ring detail -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="7" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>

  <!-- Center G -->
  <text x="32" y="37" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#666" letter-spacing="0">G</text>

  <!-- Bolt holes -->
  <circle cx="32" cy="5"  r="2" fill="#111" stroke="#555" stroke-width="0.8"/>
  <circle cx="32" cy="59" r="2" fill="#111" stroke="#555" stroke-width="0.8"/>
  <circle cx="5"  cy="32" r="2" fill="#111" stroke="#555" stroke-width="0.8"/>
  <circle cx="59" cy="32" r="2" fill="#111" stroke="#555" stroke-width="0.8"/>

  <!-- Highlight shimmer -->
  <path d="M14 18 Q32 10 50 18" fill="none" stroke="#555" stroke-width="0.8" opacity="0.5"/>
</svg>
